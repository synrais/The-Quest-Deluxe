; The Quest Deluxe: the player's settings. run_deluxe.py --fixes / --sound override them for one game.

[play]
; The original game's bugs (the Shield and Ring of Ice swap, the shop that remembers the last shop,
; the item in a tree and the others in docs/FINDINGS.md):
;   on   fix them all, in every quest pack
;   off  keep them all, as the original plays
;   pack as each quest pack says (the editor's Quest tab)
fixes = on

; The PC-speaker tones: on or off
sound = on

; Gold and items drawn over the creatures and the hero standing on them (on), or under them as the
; original draws them (off). Blood, remains and footprints stay underneath either way.
items_on_top = on

; FPS mode: the damage, "miss" and the like rising off whoever took them (on), or only the combat
; log's lines (off).
floating_numbers = off

; FPS mode, how finely the view is drawn: low, normal, high, ultra or max. Higher is sharper and slower.
fps_quality = normal

; FPS mode, how far the eye sees: level (as each level says, 10 squares if it says nothing) or a number
; of squares, 2 to 30. It never makes a level see less than the level itself says.
fps_view_distance = level

; FPS mode, the fog that the distance fades into:
;   ordered  a 4 x 4 dither (the look of EGA games)
;   fine     an 8 x 8 dither: smoother, still dotted
;   smooth   a plain blend
;   off      no dithering: no fog fading at all
fps_dither = ordered

; The whole game at a higher quality, in one switch:
;   normal  as the game looks (the shipped setting)
;   high    FPS mode drawn finer (fps_quality high) and everything scaled to the window smoothly
;   ultra   FPS mode drawn at 3 times the detail and averaged down (fps_quality max): distant things pixelate
;           much less, at a cost in speed
; It never makes fps_quality coarser than you set it.
render_quality = normal

; Scale the picture to the window smoothly (on), or in whole pixels as the original's look (off).
; render_quality high and ultra turn this on.
smooth_scaling = off

; FPS mode: textures far away (a path of pebbles, a wall, a tree) are averaged down (on), so that they fade
; smoothly instead of breaking into dashes; off skips pixels, as a plain scaler does.
fps_texture_filter = on
